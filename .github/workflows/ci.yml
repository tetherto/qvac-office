name: Integrate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint
  test:
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    name: Test / ${{ matrix.platform }}
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: npm test
  validate:
    runs-on: ubuntu-latest
    name: Open XML schemas
    steps:
      - uses: holepunchto/actions/node-base@v1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: node scripts/validate/outputs.ts validate-out
      - run: dotnet run --project scripts/validate -- validate-out
